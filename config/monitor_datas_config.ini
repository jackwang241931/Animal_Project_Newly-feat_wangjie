;监测数据的配置文件
[STORAGE]
;存储数据 在当前项目下的data文件夹下
fold_path = ./data/
;存储数据 在./data/monitor_data/ 文件夹下
sub_fold_path = /monitor_data/
;存储线程的delay 单位秒
delay = 0
;发送请求报文
[SEND]
;发送请求报文delay 单位秒
delay = 0.52
;已经弃用！发送请求报文之后获得响应报文的等待时间 单位秒
;变更为获得响应报文之后的等待时间 单位秒
get_response_delay =0
;串口配置
[Serial]
;timeout 单位秒
timeout = 0.20
;称重模块读取协议
[WEIGHT_PROTOCOL]
;false: 读取单个称重值；true: 一次读取30个原始称重点
;30点模式先显示已有点，尾部待下一轮对应时间的真实值回填，回填点仍保留在来源轮
;真实缺失记None；整轮未读到数据仍显示单个None；等待和回填提示只记录日志
read_30_points = false
;30点返回顺序：oldest_first=旧数据在前；newest_first=新数据在前
points_order = oldest_first
;定时导出xlsx配置
[EXPORT]
;定时导出xlsx间隔，单位分钟；小于等于0表示关闭定时导出
periodic_xlsx_interval_minutes = 30
[WEIGHT_POSTPROCESS]
;监控数据界面是否显示拟合称重：true替换称重列为拟合值，false显示原始值
display_fitted_weight = false
;持续寻找空秤基线时使用的滚动有效数据点数
event_window_points = 15
;低位组、高位组及异常过滤后至少保留的数据点数
minimum_group_points = 5
;合理小鼠体重范围，单位g
minimum_body_weight_g = 5.0
maximum_body_weight_g = 80.0
;首次空秤基线与实验前人工体重的最大允许偏差：比例和最小值取较大者
initial_weight_match_ratio = 0.20
initial_weight_match_min_g = 2.0
;单次称重事件内过滤异常点的最大允许偏差：比例和最小值取较大者
event_outlier_ratio = 0.05
event_outlier_min_g = 1.0
;连续平滑使用的最近有效候选体重点数
smoothing_points = 5
;EMA中新候选体重的权重，越大跟随越快
ema_alpha = 0.35
;候选体重相对当前参考值超过以下范围时，按大幅变化处理
large_change_ratio = 0.20
large_change_min_g = 5.0
;大幅增重或减重需要连续确认的相近点数
large_change_confirm_points = 3
;连续确认点必须在该时间窗口内，单位分钟
large_change_window_minutes = 10.0
;拟合结果保留小数位数
decimal_places = 3
;拟合Excel文件名后缀
output_suffix = _称重拟合
[MODULE_TEST]
;true: 仅启动环境模块采集；false: 正常启动全部模块
environment_module_only = false
