;此次UFC_UGC_ZOS测试的配置文件
;公共参数
[PARAM]
;标准大气压数值 单位千帕KPa
standard_atmospheric_pressure=101.325
;氧气补偿系数 已经弃用！！！
oxygen_compensation_coefficient=1.1524
;测试端允许跳过“气路检测必须全部有效”后再点校准
allow_calibration_without_air_validation=false
[ZOS]
; REF参数调整 %
reference_dry_oxygen_percent = 20.930
;预测因子的初始值
factor = 1.219030
;启动的预热时间 推荐20min 这里单位秒
start_time = 1200
start_time_delay =2
;启动的zos通道压力初始化的读取压力值的每秒
start_read_pressure_delay =1
;启动的zos通道压力初始化的读取压力值的总秒数 就是一共读取5次 start_read_pressure_all_time/start_read_pressure_delay
start_read_pressure_all_time = 5
;启动的zos通道压力初始化 的气压稳定的默认值 kPa
pressure_steady_default = 85.0
;启动的zos通道压力初始化 的气压稳定的阈值 kPa  pressure_steady_default ± pressure_steady_threshold
pressure_steady_threshold = 0.2
;运行后的循环时间 的间隔 单位 秒
run_time_delay =0.5
;运行后的循环时间 单位 秒 默认15 ！！！  已经弃用！！！ 使用UFC的run_time统一控制
run_time = 15
#阈值 如果在非调零状态下，氧浓度异常，小于某一个阈值（如1%），检查传感器状态, 单位：%    ！！！已经弃用
threshold =1
[O2_ANOMALY]
; 上位机湿基氧浓度异常保护；只影响补偿前的湿基氧浓度，不处理干基氧浓度
enabled = false
; 湿基氧浓度相对该通道上一有效值的最大允许跳变，单位：百分数百分点
wet_o2_jump_threshold = 0.15
; 实验启动或气路重新运行后，先完成多少个完整轮次再开始跳变判断
warmup_cycles = 3
[UFC]
;启动步骤3.1：通道1-8及参考通道9的流量控制器设定值
flow_setpoint_channel_1 = 870
flow_setpoint_channel_2 = 870
flow_setpoint_channel_3 = 990
flow_setpoint_channel_4 = 800
flow_setpoint_channel_5 = 940
flow_setpoint_channel_6 = 870
flow_setpoint_channel_7 = 810
flow_setpoint_channel_8 = 920
flow_setpoint_channel_9 = 920
;每条设定指令成功后等待时间，单位秒
flow_setpoint_delay = 2
;UFC 启动以及关闭气泵和流量控制器开启后等待的时间 单位秒 60 ！！！
wait_time = 1
;启动后需要等待1分钟 等待流量控制器自动配置及运行  这里单位秒
start_wait_time = 1
wait_time_delay = 1
;运行后的循环时间 单位 秒  弃用 ！！！默认15 ！！！
run_time = 15
run_time_delay =0.5
[UGC]
;运行后的循环时间 的间隔 单位 秒
run_time_delay =0.5
min_channel_read_interval = 1

;标定
[Calibration]
#零点标定 二氧化碳稳定阈值 单位ppm
zero_calibration_carbon_threshold =5
#零点标定 氧气稳定阈值
zero_calibration_oxygen_threshold =0.1
#SPan量程标定 氧气稳定阈值
span_calibration_oxygen_threshold =0.1
#SPan量程标定  二氧化碳稳定阈值 单位ppm
span_calibration_carbon_threshold =15
#SPan量程标定  标准气浓度 单位ppm
standard_gas_concentration =300
#零点标定 每隔几秒一次 单位秒 ！！！已经弃用
start_time_delay = 300
#零点标定 循环采样至少多少秒 ！！！已经弃用
zero_calibration_circular_times = 60
#span标定 循环采样至少多少秒 ！！！已经弃用
span_calibration_circular_times = 60
#新校准逻辑：总超时时间 单位秒（5分钟）
calibration_max_timeout = 300
#新校准逻辑：稳定持续时间 单位秒（连续15秒稳定）
calibration_stable_duration = 15
#新校准逻辑：采样间隔 单位秒（每1秒采样一次）
calibration_sample_interval = 1
#运行前 Air 校准：单通道采样间隔，单位秒（每2秒读取1个通道）
startup_air_calibration_channel_interval = 2
#运行前 Air 校准：等待传感器稳定时间，单位秒（30分钟）
startup_air_calibration_wait_time = 1800
#运行前 Air 校准：稳定阶段每路湿基氧参考值最大采集次数（需取得3个有效点）
startup_air_calibration_reference_max_attempts = 10
#运行前 Air 校准：湿基氧参考值无效后的补采间隔，单位秒
startup_air_calibration_reference_retry_interval = 5
#运行前 Air 校准：每路目标采样点数
startup_air_calibration_target_points = 120
#运行前 Air 校准：第7步最大运行时长，单位秒（按9路轮询采120点约36分钟，运行时按采样间隔动态计算）
startup_air_calibration_max_timeout = 3000
#零点标定：CO2数值范围最小值 单位ppm
zero_calibration_co2_min = 0
#零点标定：CO2数值范围最大值 单位ppm
zero_calibration_co2_max = 5000
#量程标定：CO2数值范围容差 单位ppm（标准气浓度±25ppm）
span_calibration_co2_tolerance = 25
;状态检测
[Gas_State_Check]
#状态检测 每隔几秒一次 单位秒
start_time_delay = 60
;发送请求报文
[SEND]
;发送请求报文delay 单位秒
delay = 0
;发送请求报文之后获得响应报文的等待时间 单位秒
get_response_delay = 0
;串口配置
[Serial]
;timeout 单位秒
timeout = 0.05
