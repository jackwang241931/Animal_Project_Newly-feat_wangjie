[basic]
;程序名称
name=animal_box_app
[theme];样式
;默认样式值 light dark
default = light
[window];主程序窗口项
;程序窗口名
title= 动物箱数据监测上位机
[monitor_camera_pic];tab4中的图片读取
;每隔多少秒读取一次 单位 秒
delay=1
;读取几秒钟前的数据 单位秒 实际是读delay+data_delay前的数据
data_delay= 0
[mouse_cage];鼠笼
;参考气路 编号
reference = 0
[menu];菜单栏
menu_name=[{"id":0,"text":"创建实验","tip":"对实验通道以及动物属性文件进行设置及导入等。","hide_common_tools": true,"required_app_state": "INITIALIZED"},{"id":1,"text":"设备信息","tip":"?","hide_common_tools": true,"required_app_state": "APPLYING"},{"id":2,"text":"实验检测","tip":"对实验进行设置及开始暂停停止和数据监控等。","hide_common_tools": false,"required_app_state": "CONFIGURING"},{"id":3,"text":"数据分析","tip":"对实验的数据进行二次处理等","hide_common_tools": true,"required_app_state": "CONFIGURING"}]
[dialog_timeout];实验窗口超时时间
;超时时间 单位秒
timeout =600
[system_health];全局健康状态（用于顶部状态条与系统状态页）
;健康快照的最小发布间隔，单位秒
publish_interval_seconds = 2
;连续失败达到该值后显示为“故障”
failure_threshold = 3
;连续成功达到该值后才从告警/故障恢复，避免状态闪烁
recovery_success_threshold = 2
;进程心跳超过该值未更新视为服务故障，单位秒
process_heartbeat_timeout_seconds = 30
;轨迹相机、红外相机的无新帧故障阈值，单位秒
camera_stale_seconds = 10
infrared_stale_seconds = 10
;数据库连续写入失败阈值
storage_failure_threshold = 3
[experiment_plan];实验计划摘要（P1 仅展示，不从已运行时间反推）
;计划总时长，单位小时；0 表示尚未配置，界面显示“未知”
planned_duration_hours = 0
