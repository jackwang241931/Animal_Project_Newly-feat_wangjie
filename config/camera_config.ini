[STORAGE]
;存储数据 在当前项目下的data文件夹下
fold_path = ./data/
[DELETE]
; 30分钟删除一次文件，单位秒 1800Sec = 30min
interval_seconds = 1800
;每隔几秒执行一次
delay = 1
[DEEP_CAMERA]
;各种路径
path = deep_camera/
mouse_cage_prefix = mouse_cage_
color_dir = color
save_raw_frames = false
color_jpg_size = 640
color_jpg_quality = 85
; FFmpeg low-impact video recording. Each enabled cage writes one MP4 file.
record_video = true
ffmpeg_path =
video_dir = video
video_fps = 10
video_width = 480
video_height = 270
video_bitrate_kbps = 100
video_maxrate_kbps = 120
video_bufsize_kbps = 240
video_preset = ultrafast
video_encoder_threads = 1
video_fragment_seconds = 2
video_stats_interval_seconds = 5
depth_dir = depth
result_dir = result/
result_img_dir = img/
location_filename = result_xyz
location_extension = csv
processed_log_filename = processed_log.json
;0表示不额外等待，由程序按30fps节奏采集并保存
delay = 0.033333
;每隔几秒处理一次图像 单位：秒
process_delay = 1
raw_save_interval_seconds = 0.1
delete_interval_seconds = 180
;即时清理模式下删除线程轮询间隔
delete_delay = 1
;相机与鼠笼一一对应的存储文件名称
camera_to_mouse_cage_number_file_name = deep_camera_to_mouse_cage_number_file_name.json
;相机数量
nums = 8
[INFRARED_CAMERA]
;各种路径
path = infrared_camera/
mouse_cage_prefix = mouse_cage_
pic_dir = pic
;删除前是否保留历史bmp图像：1启用，0关闭
history_enabled = 0
;历史bmp图像归档目录（相对于STORAGE.fold_path）
history_path = infrared_camera_history/
;历史bmp图像保留天数，0表示不自动删除历史
history_keep_days = 0
tmp_filename = tmp
tmp_extension = csv
;相机数量
nums = 8
;每隔几秒拍摄一次照片并存储 单位：秒
delay = 1
;相机与鼠笼一一对应的存储文件名称
camera_to_mouse_cage_number_file_name = infrared_camera_to_mouse_cage_number_file_name.json
;红外椭圆红框
ellipse_mask_enabled = 1
ellipse_center_x_ratio = 0.50
ellipse_center_y_ratio = 0.54
ellipse_axis_x_ratio = 0.36
ellipse_axis_y_ratio = 0.34
ellipse_angle = 0
[MOUSE_TRAJECTORY]
;轨迹导出目录，可写绝对路径，如 E:/AnimalData/mouse_trajectory/
;相对路径默认相对于项目根目录
export_dir = ./exports/mouse_trajectory/
box_model_path = ./model/best_box.pt
mouse_model_path = ./model/best_mouse.pt
yolo_imgsz = 640
yolo_batch_size = 8
yolo_fps_safety_factor = 0.85
processing_fps_ema_alpha = 0.10
submit_fps_adjustment_interval_seconds = 1.0
minimum_submit_fps_per_cage = 0.1
torch_num_threads = 4
torch_num_interop_threads = 1
opencv_num_threads = 1
yolo_sample_frame_step = 2
trajectory_input_mode = memory
enable_disk_backfill = false
trajectory_target_fps = 10
trajectory_submit_interval_seconds = 0.05
trajectory_max_age_seconds = 0.75
display_max_age_seconds = 2.0
trajectory_online_timeout_seconds = 2.0
max_pending_frames_per_cage = 1
max_total_pending_frames = 8
plot_window_seconds = 60
;总轨迹图初始每0.5秒采样一个点，超过上限后自动继续降采样
total_plot_sample_interval_seconds = 0.5
max_total_plot_points_per_cage = 20000
data_flush_interval_seconds = 10
;磁盘异常时每笼待落盘记录的硬上限，超限丢最旧记录并计数
max_unflushed_rows_per_cage = 5000
max_pending_plot_jobs = 8
; Runtime diagnostic summary interval in seconds. Set to 0 to disable.
trajectory_stats_log_interval_seconds = 5
trajectory_finalize_timeout_seconds = 60
annotated_save_interval_seconds = 1.0
annotated_output_width = 256
annotated_output_height = 256
trajectory_scan_limit_per_cage = 200
trajectory_file_min_age_seconds = 0.2
; YOLO mouse detection annotated history retention, unit: seconds. 0 means never delete.
annotated_history_retention_seconds = 300
; YOLO mouse detection annotated history cleanup interval, unit: seconds.
annotated_history_cleanup_interval_seconds = 60
